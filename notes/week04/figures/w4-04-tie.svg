<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300"><title>Ties make the alternative rule non-deterministic</title><rect width="760" height="300" fill="#ffffff"/><line x1="185.8" y1="84.9" x2="141.7" y2="141.1" stroke="#a9a8a2" stroke-width="1.6" stroke-linecap="round"/>
<line x1="121.2" y1="172.8" x2="91.0" y2="230.5" stroke="#a9a8a2" stroke-width="1.6" stroke-linecap="round"/>
<line x1="138.8" y1="172.8" x2="169.0" y2="230.5" stroke="#a9a8a2" stroke-width="1.6" stroke-linecap="round"/>
<line x1="209.2" y1="84.9" x2="257.0" y2="145.8" stroke="#a9a8a2" stroke-width="1.6" stroke-linecap="round"/>
<g><rect x="53.8" y="230.0" width="62.4" height="24" rx="5" fill="#f3f3f1"/><text x="85.0" y="242.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >(0, 3)</text></g>
<g><rect x="143.8" y="230.0" width="62.4" height="24" rx="5" fill="#f3f3f1"/><text x="175.0" y="242.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >(5, 3)</text></g>
<g><circle cx="130.0" cy="156.0" r="19" fill="#fdf0ea" stroke="#eb6834" stroke-width="2"/><text x="130.0" y="156.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >?</text><text x="105.0" y="139.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="end" dominant-baseline="central" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">P2</text><text x="105.0" y="139.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#52514e" text-anchor="end" dominant-baseline="central" >P2</text></g>
<g><rect x="233.8" y="144.0" width="62.4" height="24" rx="5" fill="#f3f3f1"/><text x="265.0" y="156.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >(2, 1)</text></g>
<g><circle cx="197.5" cy="70.0" r="19" fill="#eef4fc" stroke="#2a78d6" stroke-width="2"/><text x="197.5" y="70.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >?</text><text x="172.5" y="53.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="end" dominant-baseline="central" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">P1</text><text x="172.5" y="53.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#52514e" text-anchor="end" dominant-baseline="central" >P1</text></g>
<text x="30.0" y="26.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start" dominant-baseline="central" >P2 is indifferent: both moves give P2 a pay-off of 3</text>
<text x="330.0" y="96.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start" dominant-baseline="central" >Minimax for P1 (worst case)</text>
<text x="330.0" y="116.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#0b0b0b" text-anchor="start" dominant-baseline="central" >P2 node = min(0, 5) = 0;  root = max(0, 2) = 2</text>
<text x="330.0" y="148.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0b0b0b" text-anchor="start" dominant-baseline="central" >‘P2 maximises its own pay-off’</text>
<text x="330.0" y="168.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e34948" text-anchor="start" dominant-baseline="central" >P2 node = 0 or 5?  Both moves give P2 exactly 3</text>
<text x="330.0" y="200.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e34948" text-anchor="start" dominant-baseline="central" >→ root = 2 or 5: no single answer, the rule is not deterministic</text>
<text x="330.0" y="238.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="central" font-style="italic" >Pay-offs are written (Player 1, Player 2).</text></svg>