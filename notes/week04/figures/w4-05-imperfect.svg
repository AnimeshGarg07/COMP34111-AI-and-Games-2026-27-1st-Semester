<g><rect x="188.1" y="268.0" width="28.8" height="24" rx="5" fill="#f3f3f1"/><text x="202.5" y="280.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >−1</text><text x="202.5" y="302.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8984" text-anchor="middle" dominant-baseline="central" >fold</text></g>
<g><circle cx="155.0" cy="170.0" r="19" fill="#fdf0ea" stroke="#eb6834" stroke-width="2"/><text x="155.0" y="170.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >?</text></g>
<g><rect x="283.1" y="268.0" width="28.8" height="24" rx="5" fill="#f3f3f1"/><text x="297.5" y="280.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >+2</text><text x="297.5" y="302.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8984" text-anchor="middle" dominant-baseline="central" >call</text></g>
<g><rect x="378.1" y="268.0" width="28.8" height="24" rx="5" fill="#f3f3f1"/><text x="392.5" y="280.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >−1</text><text x="392.5" y="302.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8a8984" text-anchor="middle" dominant-baseline="central" >fold</text></g>
<g><circle cx="345.0" cy="170.0" r="19" fill="#fdf0ea" stroke="#eb6834" stroke-width="2"/><text x="345.0" y="170.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >?</text></g>
<g><polygon points="250.0,36.25 273.75,60 250.0,83.75 226.25,60" fill="#e9f7f1" stroke="#1baf7a" stroke-width="2"/><text x="250.0" y="60.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="middle" dominant-baseline="central" >N</text></g>
<rect x="175.9" y="106.0" width="53.2" height="18" rx="4" fill="#ffffff"/>
<text x="202.5" y="115.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="central" font-style="italic" >High ½</text>
<rect x="274.5" y="106.0" width="46.0" height="18" rx="4" fill="#ffffff"/>
<text x="297.5" y="115.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="central" font-style="italic" >Low ½</text>
<rect x="117" y="144" width="266" height="52" rx="26" fill="none" stroke="#52514e" stroke-width="1.4" stroke-dasharray="6 4"/>
<text x="250.0" y="170.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#eb6834" text-anchor="middle" dominant-baseline="central" >P2</text>
<text x="250.0" y="338.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#52514e" text-anchor="middle" dominant-baseline="central" >dashed loop = one information set: P2 cannot tell which card P1 holds</text>
<text x="470.0" y="40.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start" dominant-baseline="central" >Pay-offs shown to P2</text>
<text x="470.0" y="76.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start" dominant-baseline="central" >If the card was dealt by chance:</text>
<text x="470.0" y="102.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="central" >call = ½(−2) + ½(+2) = 0,  fold = −1  → call</text>
<text x="470.0" y="132.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0b0b0b" text-anchor="start" dominant-baseline="central" >If P1 chose which node we are at:</text>
<text x="470.0" y="158.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start" dominant-baseline="central" >call = min(−2, +2) = −2,  fold = −1  → fold</text>
<text x="470.0" y="188.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#e34948" text-anchor="start" dominant-baseline="central" >Real card games mix both: chance deals,</text>
<text x="470.0" y="214.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e34948" text-anchor="start" dominant-baseline="central" >then P1 bets knowing its card. Neither</text>
<text x="470.0" y="244.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#e34948" text-anchor="start" dominant-baseline="central" >rule alone gives the true value.</text></svg>