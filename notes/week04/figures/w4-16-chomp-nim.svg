<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470"><title>Chomp and Nim</title><rect width="980" height="470" fill="#ffffff"/><text x="30.0" y="30.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#0b0b0b" text-anchor="start" dominant-baseline="central" >2 × 3 Chomp: whoever eats the poisoned square (P, bottom-left) loses</text>
<rect x="41" y="115" width="42" height="42" rx="5" fill="#c0392b"/>
<text x="62.0" y="137.0" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle" dominant-baseline="central" >P</text>
<rect x="85" y="115" width="42" height="42" rx="5" fill="#8a5a3c"/>
<rect x="129" y="115" width="42" height="42" rx="5" fill="#8a5a3c"/>
